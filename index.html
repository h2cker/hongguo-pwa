        }
      }

      const grid = document.getElementById("epGrid");
      grid.innerHTML = "";
      const startIdx = numPages > 1 ? epRangeIdx * EP_PAGE : 0;
      const endIdx = numPages > 1 ? Math.min(total, (epRangeIdx + 1) * EP_PAGE) : total;
      const indices = [];
      for (let i = startIdx; i < endIdx; i++) indices.push(i);
      if (epDesc) indices.reverse();

      indices.forEach(i => {
        const ep = state.episodes[i];
        const btn = document.createElement("button");
        btn.className = "ep-item" + (i === state.epIdx ? " active" : "");
        btn.textContent = ep.index || (i + 1);
        btn.onclick = () => {
          state.userInteracted = true;
          setSwipeMode("episode");
          closeSheet("epSheet");
          playEpisode(i);
        };
        grid.appendChild(btn);
      });
      requestAnimationFrame(() => {
        rangesEl.querySelector(".ep-range-btn.active")?.scrollIntoView({ block: "nearest", inline: "center" });
        grid.querySelector(".ep-item.active")?.scrollIntoView({ block: "center", inline: "nearest" });
      });
    }

    function openEpSheet() {
      if (!state.episodes.length) return;
      epRangeIdx = Math.floor(state.epIdx / EP_PAGE);
      renderEpSheet();
      openSheet("epSheet");
    }

    document.getElementById("btnEpisodes").addEventListener("click", openEpSheet);
    document.getElementById("epBadge").addEventListener("click", openEpSheet);
    document.getElementById("epSortBtn").addEventListener("click", () => { epDesc = !epDesc; renderEpSheet(); });
    document.getElementById("epPrevQuick").addEventListener("click", () => {
      if (state.epIdx <= 0) { toast("已经是第1集了"); return; }
      state.userInteracted = true;
      closeSheet("epSheet");
      playEpisode(state.epIdx - 1);
    });

    // Search + Suggest + Pagination
    let searchKw = "", searchCursor = 0, searchItems = [];
    document.getElementById("btnSearch").addEventListener("click", () => {
      openSheet("searchSheet");
      setTimeout(() => document.getElementById("searchInput").focus(), 140);
    });
    let suggestTimer = 0;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(suggestTimer);
      const kw = document.getElementById("searchInput").value.trim();
      const sugEl = document.getElementById("suggestList");
      if (!kw) { sugEl.innerHTML = ""; return; }
      suggestTimer = setTimeout(async () => {
        try {
          const list = await api("SearchSuggest", [kw]);
          sugEl.innerHTML = "";
          (list || []).slice(0, 5).forEach(s => {
            const div = document.createElement("div");
            div.className = "suggest-item";
            div.textContent = s.word;
            div.onclick = () => {
              document.getElementById("searchInput").value = s.word;
              sugEl.innerHTML = "";
              doSearch(false);
            };
            sugEl.appendChild(div);
          });
        } catch (_) {}
      }, 220);
    });
    async function doSearch(loadMore = false) {
      const kw = document.getElementById("searchInput").value.trim();
      if (!kw) return;
      document.getElementById("suggestList").innerHTML = "";
      const list = document.getElementById("searchList");
      if (!loadMore) {
        searchKw = kw;
        searchCursor = 0;
        searchItems = [];
        list.innerHTML = "<div style='opacity:.6;padding:20px;text-align:center'>搜索中...</div>";
      }
      try {
        const res = await api("Search", [searchKw, searchCursor]);
        const items = (res && res.items) || [];
        searchCursor = res.cursor || 0;
        searchItems.push(...items);
        renderDramaList(list, searchItems, "searchSheet", false, res.hasMore ? () => doSearch(true) : null);
      } catch (e) {
        list.innerHTML = `<div style='opacity:.6;padding:20px;text-align:center'>搜索失败: ${e.message}</div>`;
      }
    }
    document.getElementById("searchGo").addEventListener("click", () => doSearch(false));
    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch(false);
    });

    // Rank & Category sheet
    let rankCats = [], rankSubs = [], rankId = "ranklist_hot_sc", rankFilter = "", rankCursor = 0, rankItems = [];
    function renderRankFilters(sub) {
      const filtersEl = document.getElementById("rankFilters");
      filtersEl.innerHTML = "";
      const opts = [];
      ((sub && sub.panel) || []).forEach(g => {
        (g.options || []).forEach(o => opts.push(o));
      });
      if (!opts.length) return;
      opts.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "lib-tab" + ((opt.id === rankFilter || (idx === 0 && !rankFilter)) ? " active" : "");
        btn.textContent = opt.name;
        btn.onclick = () => {
          filtersEl.querySelectorAll(".lib-tab").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          rankFilter = opt.id;
          loadRank(false);
        };
        filtersEl.appendChild(btn);
      });
    }
    function renderRankSubs(subs) {
      rankSubs = subs && subs.length ? subs : [{ id: "ranklist_hot_sc", name: "推荐榜" }];
      const tabsEl = document.getElementById("rankTabs");
      tabsEl.innerHTML = "";
      rankSubs.forEach((sub, i) => {
        const btn = document.createElement("button");
        btn.className = "lib-tab" + (i === 0 ? " active" : "");
        btn.textContent = sub.name;
        btn.onclick = () => {
          tabsEl.querySelectorAll(".lib-tab").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          rankId = sub.id;
          rankFilter = "";
          renderRankFilters(sub);
          loadRank(false);
        };
        tabsEl.appendChild(btn);
      });
      rankId = rankSubs[0].id;
      rankFilter = "";
      renderRankFilters(rankSubs[0]);
    }
    async function loadRank(loadMore = false) {
      const list = document.getElementById("rankList");
      if (!loadMore) {
        rankCursor = 0;
        rankItems = [];
        list.innerHTML = "<div style='opacity:.6;padding:20px;text-align:center'>加载榜单中...</div>";
      }
      try {
        const res = await api("Rank", [rankId, rankFilter, rankCursor]);
        const items = (res && res.items) || [];
        rankCursor = res.cursor || 0;
        rankItems.push(...items);
        renderDramaList(list, rankItems, "rankSheet", false, res.hasMore ? () => loadRank(true) : null);
      } catch (e) {
        list.innerHTML = `<div style='opacity:.6;padding:20px;text-align:center'>加载失败: ${e.message}</div>`;
      }
    }
    document.getElementById("btnRank").addEventListener("click", async () => {
      openSheet("rankSheet");
      if (!rankCats.length) {
        try {
          const panel = await api("RankPanel", []);
          rankCats = (panel || []).filter(c => c.subs && c.subs.length);
          if (!rankCats.length) rankCats = [{ name: "全部", subs: [{ id: "ranklist_hot_sc", name: "推荐榜" }] }];
          const catsEl = document.getElementById("rankCats");
          catsEl.innerHTML = "";
          rankCats.forEach((cat, i) => {
            const btn = document.createElement("button");
            btn.className = "lib-tab" + (i === 0 ? " active" : "");
            btn.textContent = cat.name;
            btn.onclick = () => {
              catsEl.querySelectorAll(".lib-tab").forEach(b => b.classList.remove("active"));
              btn.classList.add("active");
              renderRankSubs(cat.subs);
              loadRank(false);
            };
            catsEl.appendChild(btn);
          });
          renderRankSubs(rankCats[0].subs);
        } catch (_) {}
      }
      if (!rankItems.length) loadRank(false);
    });

    // Library
    function renderLibrary() {
      const list = document.getElementById("libList");
      const favs = Object.values(state.favorites).sort((a, b) => b.updatedAt - a.updatedAt);
      const hist = Object.values(state.history).sort((a, b) => b.updatedAt - a.updatedAt);
      let items = [];
      if (state.libTab === "fav") {
        items = favs.map(x => ({ ...x, _tag: "★ 收藏" }));
      } else if (state.libTab === "hist") {
        items = hist.map(x => ({ ...x, _tag: "历史" }));
      } else {
        const seen = new Set();
        favs.forEach(x => { seen.add(x.id); items.push({ ...x, _tag: "★ 收藏" }); });
        hist.forEach(x => { if (!seen.has(x.id)) items.push({ ...x, _tag: "历史" }); });
      }
      renderDramaList(list, items, "libSheet", true);
    }
    document.getElementById("btnLibrary").addEventListener("click", () => {
      renderLibrary();
      openSheet("libSheet");
    });
    document.querySelectorAll(".lib-tab[data-lib]").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".lib-tab[data-lib]").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        state.libTab = tab.dataset.lib;
        renderLibrary();
      });
    });
    document.getElementById("btnClearHist").addEventListener("click", () => {
      state.history = {};
      localStorage.setItem("hg_hist", "{}");
      renderLibrary();
      toast("已清空观看历史");
    });

    function escHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function renderDramaList(container, items, sheetId, isLocal = false, onLoadMore = null) {
      if (!items.length) {
        container.innerHTML = "<div style='opacity:.55;padding:28px;text-align:center'>暂无内容</div>";
        return;
      }
      container.innerHTML = "";
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "drama-card";
        card.innerHTML = `
          <img class="drama-cover" src="${escHtml(item.cover)}" loading="lazy" />
          <div class="drama-meta">
            <div class="drama-name">${escHtml(item.title)}</div>
            <div class="drama-sub">${item._tag ? escHtml(item._tag) + " · " : ""}${item.episodeCount || 0}集 ${item.heat ? "· " + escHtml(item.heat) : ""} ${isLocal ? "· 看到第" + ((item.epIdx || 0) + 1) + "集" : ""}</div>
            <div class="drama-desc">${escHtml(item.intro)}</div>
          </div>
        `;
        card.onclick = async () => {
          state.userInteracted = true;
          setSwipeMode("episode");
          closeSheet(sheetId);
          toast("加载剧集中...");
          const saved = state.history[item.id];
          const startIdx = isLocal ? (item.epIdx || 0) : ((saved && saved.epIdx) || 0);
          const resumeSec = isLocal ? (item.posSec || 0) : ((saved && saved.posSec) || 0);
          await openSeries(item, [], startIdx, resumeSec);
        };
        container.appendChild(card);
      });
      if (onLoadMore) {
        const more = document.createElement("button");
        more.className = "load-more-btn";
        more.textContent = "加载更多";
        more.onclick = () => { more.textContent = "加载中..."; onLoadMore(); };
        container.appendChild(more);
      }
    }

    // Flush current progress when backgrounding or closing PWA/tab
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && player && !isNaN(player.currentTime)) {
        saveHistory(player.currentTime);
      }
    });
    window.addEventListener("pagehide", () => {
      if (player && !isNaN(player.currentTime)) {
        saveHistory(player.currentTime);
      }
    });

    // Boot (support ?s=seriesId&ep=1 direct share link; otherwise start fresh random feed)
    async function boot() {
      const params = new URLSearchParams(location.search);
      const sid = params.get("s");
      const hasEpParam = params.has("ep");
      const epParam = parseInt(params.get("ep") || "1", 10);
      if (sid) {
        try {
          setSwipeMode("episode");
          const saved = state.history[sid];
          const startIdx = hasEpParam ? Math.max(0, epParam - 1) : ((saved && saved.epIdx) || 0);
          const resumeSec = hasEpParam ? 0 : ((saved && saved.posSec) || 0);
          await openSeries({ id: sid, title: (saved && saved.title) || "加载中...", cover: saved && saved.cover }, [], startIdx, resumeSec);
          loadFeed(false);
          return;
        } catch (e) {
          if (String(e.message).includes("密码")) return;
        }
      }
      const last = Object.values(state.history).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
      if (last && last.id) markFeedSeen(last.id);
      setSwipeMode("series");
      loadFeed(true);
    }
    if ("serviceWorker" in navigator) {
      const hadController = Boolean(navigator.serviceWorker.controller);
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController || refreshing) return;
        refreshing = true;
        location.reload();
      });
      navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).then((reg) => {
        reg.update().catch(() => {});
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      }).catch(() => {});
    }
    boot();
  </script>
</body>
</html>
