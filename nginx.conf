server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types application/json text/css application/javascript;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://v5-proxy:9589;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9589;
        proxy_buffering off;
    }

    location /v5media/ {
        proxy_pass http://v5-proxy:9589;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /media/ {
        proxy_pass http://shortdramacat:9587;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9587;
        proxy_set_header Origin http://127.0.0.1:9587;
        proxy_set_header Referer http://127.0.0.1:9587/;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
